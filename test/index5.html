<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Animazione Firma</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    .signature {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 35.03%;
    }

    .signature svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    button {
      margin-top: 20px;
      padding: 10px 22px;
      font-size: 15px;
      cursor: pointer;
      background: #020202;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }
	
	* Sfondo leggermente caldo tipo carta/tela (puoi lasciarlo #ffffff se preferisci) */
body {
  background: #faf8f5;
}

/* Transizione morbida quando si attiva l'effetto materico a fine firma */
#signature-group {
  transition: filter 1.2s ease-in-out, opacity 1.2s ease-in-out;
}

#signature-group.painted {
  filter: url(#impasto-paint);
}

#signature-group path {
  fill: #1e3a8a; /* Esempio: Blu oltremare scuro */
  transition: fill 0.4s ease;
}

  </style>
</head>

  <!-- 1. Crea la texture irregolare delle setole e del colore denso -->
  <feTurbulence type="fractalNoise" baseFrequency="0.06 0.14" numOctaves="4" seed="12" result="brushNoise" />
  
  <!-- 2. Deforma leggermente i bordi per simulare la trama della tela -->
  <feDisplacementMap in="SourceGraphic" in2="brushNoise" scale="1.8" xChannelSelector="R" yChannelSelector="G" result="texturedStroke" />

  <!-- 3. Estrae il canale alfa per creare la mappa di altezza del colore -->
  <feGaussianBlur in="texturedStroke" stdDeviation="1.4" result="heightMap" />
  <feComposite in="heightMap" in2="brushNoise" operator="arithmetic" k1="0.6" k2="0.6" k3="0" k4="0" result="impastoRelief" />

  <!-- 4. Luce direzionale radente che crea i riflessi lucidi della pennellata -->
  <feSpecularLighting in="impastoRelief" surfaceScale="4.5" specularConstant="0.75" specularExponent="22" lighting-color="#ffffff" result="specularHighlights">
    <fePointLight x="-150" y="-200" z="220" />
  </feSpecularLighting>

  <!-- 5. Ritaglia i riflessi esclusivamente dentro il tratto della firma -->
  <feComposite in="specularHighlights" in2="texturedStroke" operator="in" result="clippedHighlights" />

  <!-- 6. Unisce il colore scuro della firma con i riflessi lucidi del pennello -->
  <feComposite in="texturedStroke" in2="clippedHighlights" operator="arithmetic" k1="0" k2="1" k3="0.85" k4="0" result="litPaint" />

  <!-- 7. Aggiunge un leggero spessore d'ombra proiettata sulla tela -->
  <feDropShadow in="litPaint" dx="1.5" dy="2.5" stdDeviation="1.6" flood-color="#000000" flood-opacity="0.32" />
</filter>

<script>
 
 window.signature = {
  timer: null,
  totalDuration: 0,

  initialize: function() {
    clearTimeout(this.timer);
    const group = document.getElementById('signature-group');
    if (group) group.classList.remove('painted');

    const paths = document.querySelectorAll('.signature svg mask path');
    let delay = 0;

    paths.forEach((path) => {
      const length = path.getTotalLength();
      const speed = length < 60 ? 120 : Math.floor(length * 1.1);

      path.style.transition = 'none';
      path.style.strokeDasharray = `${length} ${length}`;
      path.style.strokeDashoffset = length;
      path.dataset.speed = speed;
      path.dataset.delay = delay;

      delay += speed + 70;
    });

    this.totalDuration = delay;
  },

  animate: function() {
    const paths = document.querySelectorAll('.signature svg mask path');
    paths.forEach((path) => {
      const speed = path.dataset.speed;
      const delay = path.dataset.delay;
      path.style.transition = `stroke-dashoffset ${speed}ms ${delay}ms ease-in-out`;
      path.style.strokeDashoffset = '0';
    });

    this.timer = setTimeout(() => {
      const group = document.getElementById('signature-group');
      if (group) group.classList.add('painted');
    }, this.totalDuration);
  }
};

window.signature.initialize();
setTimeout(() => window.signature.animate(), 100);

document.getElementById('replay').addEventListener('click', () => {
  window.signature.initialize();
  setTimeout(() => window.signature.animate(), 100);
});

</script>
