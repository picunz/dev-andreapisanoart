  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #ffffff;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      text-align: center;
    }

    .signature {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 35.03%;
    }

    .signature svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    button {
      margin-top: 20px;
      padding: 10px 22px;
      font-size: 15px;
      cursor: pointer;
      background: #020202;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }
  </style>

<script>
  window.signature = {
    initialize: function() {
      const paths = document.querySelectorAll('.signature svg mask path');
      let delay = 0;

      paths.forEach((path) => {
        const length = path.getTotalLength();
        const speed = length < 100 ? 150 : Math.floor(length * 1.5);

        path.style.transition = 'none';
        path.style.strokeDasharray = `${length} ${length}`;
        path.style.strokeDashoffset = length;
        path.dataset.speed = speed;
        path.dataset.delay = delay;

        delay += speed + 100;
      });
    },

    animate: function() {
      const paths = document.querySelectorAll('.signature svg mask path');
      paths.forEach((path) => {
        const speed = path.dataset.speed;
        const delay = path.dataset.delay;
        path.style.transition = `stroke-dashoffset ${speed}ms ${delay}ms ease-in-out`;
        path.style.strokeDashoffset = '0';
      });
    }
  };

  window.signature.initialize();
  setTimeout(() => window.signature.animate(), 100);

  document.getElementById('replay').addEventListener('click', () => {
    window.signature.initialize();
    setTimeout(() => window.signature.animate(), 100);
  });
</script>
